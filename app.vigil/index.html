<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Color scheme: set data-theme before paint to avoid a flash of the wrong
         theme. Mirrors src/constants/theme.constant.ts (storage key) and
         src/stores/colorScheme.store.ts (resolution logic). -->
    <script>
      (function () {
        try {
          var preference = localStorage.getItem('app.vigil:color-scheme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = preference === 'dark' || ((!preference || preference === 'system') && prefersDark);
          document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
